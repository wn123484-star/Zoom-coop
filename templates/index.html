<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bảng Chung Online - Không Gian Hợp Tác & Giải Trí Thời Gian Thực</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%230984e3'/><circle cx='32' cy='32' r='18' fill='%2300d2ff'/></svg>">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="lobby-container">
<h1 class="logo-glow">Bảng Chung Online</h1>
<form id="join-form">
<input type="text" id="username" placeholder="Nhập tên hiển thị của bạn..." required autocomplete="off" maxlength="35">
<input type="text" id="room_id" placeholder="Nhập mã phòng (VD: nhom1, lop10a)..." required autocomplete="off" maxlength="40">
<button type="submit">Vào Không Gian Chung</button>
</form>
</div>
<script>
const savedName = localStorage.getItem('syncspace_username');
if (savedName) {
    document.getElementById('username').value = savedName;
}
document.getElementById('join-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const name = document.getElementById('username').value.trim();
    const room = document.getElementById('room_id').value.trim();
    if (name && room) {
        localStorage.setItem('syncspace_username', name);
        window.location.href = `/room/${encodeURIComponent(room)}?name=${encodeURIComponent(name)}`;
    }
});
</script>
</body>
</html>
